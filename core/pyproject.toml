[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hnb-copilot-customization"
version = "0.1.0"
description = "Traceable Copilot SDLC coordination and Agent Plugins 1.0 packaging"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sdlc = "copilot_customization.cli:main"
copilot-sdlc = "copilot_customization.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
